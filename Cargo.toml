[package]
name = "fusebox"
version = "0.4.0"
edition = "2024"
description = "One lightweight control plane for agent secrets, MCP servers, CLIs and Skills."
license = "MIT"
repository = "https://github.com/risingjerry/agent-switch"
rust-version = "1.89"

[[bin]]
name = "fusebox"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
regex-lite = "0.1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
