name: Bug report
description: Something Fusebox did wrong
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    attributes:
      label: Steps and command output
      description: Paste `fusebox --version` and the failing command with `--json` if it has one. Never paste secret values.
    validations: {required: true}
  - type: input
    attributes:
      label: OS and agents
      placeholder: macOS 26, Claude Code 2.x, Codex 0.x
