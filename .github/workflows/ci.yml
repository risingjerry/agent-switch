name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - run: ./target/release/fusebox --version

  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: swift build --package-path macos-app/AgentSwitch
      - run: >-
          xcodebuild
          -project macos-app/AgentSwitch/AgentSwitch.xcodeproj
          -scheme AgentSwitch
          -configuration Release
          -derivedDataPath "$RUNNER_TEMP/FuseboxDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject common credential and private-path shapes
        run: python3 scripts/privacy_scan.py
